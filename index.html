<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/branding/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>UniFood — Peça comida na sua universidade</title>
    <meta
      name="description"
      content="UniFood conecta estudantes a vendedores dentro do campus. Peça seu lanche entre uma aula e outra e retire direto com o vendedor."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://unifood.com.br/" />
    <meta name="theme-color" content="#FF5A3C" />

    <!-- Open Graph — como o link aparece quando compartilhado no WhatsApp,
         Instagram, Facebook etc. Sem isso, o preview vem em branco ou só com
         a URL crua, o que reduz muito o clique em compartilhamentos. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UniFood" />
    <meta property="og:title" content="UniFood — Peça comida na sua universidade" />
    <meta
      property="og:description"
      content="Peça seu lanche entre uma aula e outra e retire direto com o vendedor na sua universidade."
    />
    <meta property="og:url" content="https://unifood.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <!-- og:image fica pendente até existir uma imagem de capa (1200x630px)
         hospedada publicamente — sem ela o preview de compartilhamento sai
         sem miniatura. -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UniFood — Peça comida na sua universidade" />
    <meta
      name="twitter:description"
      content="Peça seu lanche entre uma aula e outra e retire direto com o vendedor na sua universidade."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
